name: Stage 1 hardware-free checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dummy-cluster:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: x64
          cache: pip
      - name: Pin installer
        run: python -m pip install pip==25.0.1
      - name: Install validated dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Compile example and export artifacts
        run: python examples/dummy_cluster.py
      - name: Check compilation properties without hardware
        run: python -m unittest discover -s tests -v
